<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />

<title>環境知識每日挑戰</title>
<style>
:root{--ink:#15352b;--muted:#6f8178;--line:#dce8df;--paper:#f7fbf8;--card:#fff;--green:#207a58;--green2:#dff3e7;--orange:#ee8b3a;--red:#c84b46;--shadow:0 12px 30px rgba(24,64,44,.08)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f3faf5 0%,#edf6f1 45%,#fbf8ef 100%);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.65} button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:28px 20px 64px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.12em;font-size:.8rem}.hero h1{margin:5px 0 4px;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.04em;line-height:1.15}.hero p{margin:0;color:var(--muted)}.date-pill{white-space:nowrap;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 24px}.toolbar button,.submit{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:800;transition:.2s}.primary{background:var(--green);color:#fff;box-shadow:0 6px 14px rgba(32,122,88,.2)}.primary:hover{transform:translateY(-1px);filter:brightness(1.05)}.ghost{background:#fff;color:var(--green);border:1px solid var(--line)!important}.meta{margin-left:auto;color:var(--muted);font-size:.9rem}.progress{height:9px;background:#e0ebe4;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#75bb85);border-radius:inherit;transition:width .35s}.quiz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.question{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative}.question h2{font-size:1rem;line-height:1.55;margin:0 0 14px}.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.qnum{color:var(--green);font-weight:900}.tag{font-size:.76rem;background:var(--green2);padding:3px 9px;border-radius:99px;color:var(--green);font-weight:800}.options{display:grid;gap:9px}.option{position:relative}.option input{position:absolute;opacity:0}.option label{display:block;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;background:#fbfdfb;transition:.15s}.option label:hover{border-color:#9dcbb0;background:#f4fbf6}.option input:checked+label{border-color:var(--green);background:var(--green2);box-shadow:inset 0 0 0 1px var(--green);font-weight:700}.option input:focus-visible+label{outline:3px solid #9fd1b0;outline-offset:2px}.submitbar{display:flex;justify-content:center;margin:28px 0}.submit{font-size:1.08rem;padding:14px 30px}.result{display:none;background:var(--ink);color:#fff;border-radius:20px;padding:24px;margin-bottom:22px}.result.show{display:block}.scoreline{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.score{font-size:2.8rem;font-weight:900;line-height:1}.result small{color:#bed9c8}.review{display:grid;gap:14px}.review h2{margin:8px 0 0;font-size:1.4rem}.wrong{background:#fff;border:1px solid #f0c3bd;border-left:5px solid var(--red);border-radius:14px;padding:16px 18px}.wrong .question-text{font-weight:800;margin-bottom:9px}.wrong p{margin:4px 0}.wrong .answer{color:var(--green);font-weight:800}.wrong .explain{color:#52655b;font-size:.94rem}.empty{color:#d8f1df}.modal{position:fixed;inset:0;background:rgba(13,42,28,.45);display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}.modal-card{background:#fff;border-radius:18px;max-width:620px;width:100%;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal-card h2{margin-top:0}.modal-card p{color:var(--muted);font-size:.92rem}.modal-card input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:760px){.wrap{padding:20px 14px 42px}.hero{display:block}.date-pill{display:inline-block;margin-top:14px}.quiz-grid{grid-template-columns:1fr}.meta{margin-left:0;width:100%}.toolbar{margin-bottom:16px}.question{padding:16px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div><div class="eyebrow">環境知識競賽・每日練習</div><h1>今天，為環境多懂一點</h1><p>每天從題庫抽出 40 題，完成後立即查看錯題、正解與詳解。</p></div><div class="date-pill" id="datePill"></div></header>
<div class="toolbar"><button class="ghost" id="reshuffleBtn">重新抽題</button><button class="ghost" id="importBtn">匯入題庫</button><span class="meta" id="statusText"></span></div>
<div class="progress"><i id="progressBar" style="width:0%"></i></div>
<section id="result" class="result" aria-live="polite"><div class="scoreline"><div class="score" id="scoreText">0 / 40</div><div><strong id="resultTitle">完成今日挑戰</strong><br><small id="resultHint"></small></div></div></section>
<form id="quizForm"><div class="quiz-grid" id="quiz"></div><div class="submitbar"><button class="submit primary" type="submit">送出答案，查看結果</button></div></form>
<section id="review" class="review" aria-live="polite"></section>
</main>
<div class="modal" id="modal"><div class="modal-card"><h2>匯入外部題庫</h2><p>請選擇由 Google 試算表下載的 CSV 或 JSON 檔。JSON 欄位可使用：question、options、answer、explanation、category。</p><input id="fileInput" type="file" accept=".csv,.json,text/csv,application/json"><div class="modal-actions"><button class="ghost" id="cancelImport" type="button">取消</button><button class="primary toolbar button" id="confirmImport" type="button">讀取題庫</button></div></div></div><div class="toast" id="toast"></div>
<script>
let bank=[
{category:'循環經濟',question:'循環經濟希望材料扮演什麼角色？',options:['快速使用後丟棄','一直留在系統裡循環使用','只在工廠內使用','全部改用一次性材料'],answer:1,explanation:'循環經濟的核心是讓材料在生產與消費之間持續流動，延長價值與使用壽命。'},
{category:'循環經濟',question:'以下哪一項通常比回收一件衣服更有效？',options:['購買更多促銷品','少買一件不需要的衣服','把濕衣服放入回收箱','只看包裝顏色'],answer:1,explanation:'減量從源頭避免資源、能源與水的消耗，通常比事後處理更有效。'},
{category:'循環經濟',question:'為什麼單一材質的衣服較容易回收？',options:['顏色一定比較鮮豔','拆解與分類較簡單','價格一定比較便宜','不需要清洗'],answer:1,explanation:'單一材質減少拆解與分類的複雜度，有助於提高回收效率。'},
{category:'循環經濟',question:'下列哪個做法能延長衣物壽命？',options:['二手交換與修補','增加汰換頻率','丟棄小瑕疵衣物','混合更多黏著劑'],answer:0,explanation:'二手交換、租借、修補與改衣，能讓同一件衣服服務更多人。'},
{category:'循環經濟',question:'舊衣仍可穿時，較能保留其價值的方式是？',options:['直接打碎成纖維','再穿或轉讓','焚燒發電','混入一般垃圾'],answer:1,explanation:'再使用通常比材料層級的回收更能保留產品原有價值。'},
{category:'循環經濟',question:'哪種衣物不宜直接混入回收箱？',options:['乾淨的衣物','沾染油漬或發霉的衣物','整理好的二手衣','可再穿的外套'],answer:1,explanation:'油漬、濕氣與黴菌會增加分類與處理困難，應依當地規定處理。'},
{category:'循環經濟',question:'企業推動循環商業模式可以採取哪一項？',options:['租賃、回收折抵與維修服務','隱藏材料資訊','縮短產品壽命','取消回收責任'],answer:0,explanation:'租賃、回收折抵與維修服務能把產品價值留在循環中。'},
{category:'循環經濟',question:'選購紡織品時，消費者可以先查看什麼？',options:['材質標示與可信的回收管道','網紅的單一推薦','包裝大小','折扣倒數時間'],answer:0,explanation:'材質資訊與回收管道有助於做出可追溯、較負責任的選擇。'},
{category:'無形文化資產',question:'無形文化資產中的傳統知識通常如何傳承？',options:['只靠博物館展示','口述、示範與參與','只靠廣告','禁止社群使用'],answer:1,explanation:'傳統知識常透過口述、示範與實際參與傳給下一代。'},
{category:'無形文化資產',question:'傳統知識的特色是什麼？',options:['永遠不能調整','會隨環境變動而調整','只屬於單一個人','與生活完全無關'],answer:1,explanation:'活的傳統會被社群持續使用、理解與重新詮釋。'},
{category:'無形文化資產',question:'地方傳統知識可協助環境保育的原因是？',options:['累積對季節與土地的長期觀察','一定取代所有科學研究','只追求觀光收益','不需要社群參與'],answer:0,explanation:'地方經驗包含對季節、水文、土壤與生物的長期觀察，可補充科學資料。'},
{category:'無形文化資產',question:'引用社群傳統知識前，研究者應優先做到什麼？',options:['取得同意並說明來源','直接改名販售','隱藏知識提供者','只複製不分享成果'],answer:0,explanation:'尊重權利包含說明來源、取得同意與合理分享成果。'},
{category:'無形文化資產',question:'保存無形文化資產的重點不只是記錄技術，還包括？',options:['維持使用它的語境與社會關係','把技術封存不用','只保留漂亮照片','移除地方記憶'],answer:0,explanation:'技術與其價值、語境及社會關係一起保存，傳承才有意義。'},
{category:'無形文化資產',question:'學校可以如何促進傳統知識傳承？',options:['邀請工藝師進課堂讓學生操作','只要求背誦名詞','禁止學生提問','只播放廣告'],answer:0,explanation:'實作、工作坊與青年學徒制度能提供新的學習入口。'},
{category:'無形文化資產',question:'面對氣候變遷，傳統知識與科學研究應如何合作？',options:['互相對話、彼此補充','只採信其中一方','避免地方居民參與','停止長期觀察'],answer:0,explanation:'科學提供測量與模型，地方經驗提供細節與長期觀察，兩者可互補。'},
{category:'無形文化資產',question:'尊重地方文化的消費行動是？',options:['購買有清楚來源的地方產品','把文化簡化成噱頭','未經同意複製圖樣','只看最低價格'],answer:0,explanation:'清楚來源、理解故事並支持社群，是較尊重文化權利的做法。'},
{category:'綠生活',question:'選擇當季、在地、適量的食物，主要能減少？',options:['運輸與冷藏需求','食物營養','社區互動','食材種類'],answer:0,explanation:'在地與當季食物通常可降低長途運輸與冷藏所需的資源。'},
{category:'綠生活',question:'「吃多少煮多少」有助於降低哪一項？',options:['廚餘與甲烷排放','飲水品質','大眾運輸量','森林面積'],answer:0,explanation:'減少食物浪費，就能降低廚餘處理與分解產生的排放。'},
{category:'綠生活',question:'判斷產品是否環保時，應關注什麼？',options:['使用年限與整體生命週期','只有綠色標章','包裝是否閃亮','廣告口號長短'],answer:0,explanation:'產品的材料、製造、使用與處置都應納入生命週期評估。'},
{category:'綠生活',question:'住家節能的做法是？',options:['善用自然通風與遮陽','讓電器長時間待機','冷氣設定越低越好','白天全屋開燈'],answer:0,explanation:'自然通風、遮陽與高效率電器可降低空調與照明需求。'},
{category:'綠生活',question:'哪項用水行動較適合日常實踐？',options:['修理漏水並縮短淋浴','把油脂倒入排水孔','讓水龍頭持續開啟','用清水沖洗街道'],answer:0,explanation:'修漏水、縮短淋浴與回收洗米水，都是可行的節水行動。'},
{category:'綠生活',question:'短程交通優先建議採用？',options:['步行或騎自行車','單人開車怠速','繞路找停車位','搭乘空車計程車'],answer:0,explanation:'短程步行或騎自行車能減少燃料使用與交通排放。'},
{category:'綠生活',question:'下列哪項能把個人努力變成社區改變？',options:['共享工具與社區菜園','各自囤積物品','拒絕交換','增加一次性用品'],answer:0,explanation:'共享、交換與社區合作能讓資源使用更有效率。'},
{category:'綠生活',question:'查證環境資訊可以避免什麼現象？',options:['綠色漂洗','自然通風','食物保存','資源共享'],answer:0,explanation:'了解來源、認證規範與回收方式，有助於辨識只有宣傳、缺乏實質作為的綠色漂洗。'},
{category:'綠色能源',question:'下列何者屬於再生能源？',options:['太陽光電','燃煤','石油','天然氣'],answer:0,explanation:'太陽光電、風力、水力、地熱與生質能都屬於再生能源。'},
{category:'綠色能源',question:'太陽能與風力發電的共同挑戰是？',options:['受天候與時段影響','完全不需電網','一定造成核廢料','只能在夜間發電'],answer:0,explanation:'間歇性電源需要儲能、需求反應與跨區調度來維持供電穩定。'},
{category:'綠色能源',question:'能源轉型除了增加再生能源，還需要？',options:['提高能源效率並減少不必要需求','鼓勵浪費電力','取消建築隔熱','增加空轉設備'],answer:0,explanation:'節能與效率提升能從源頭降低能源需求，是能源轉型的重要部分。'},
{category:'綠色能源',question:'電動車的減碳效益與哪項因素有關？',options:['電力來源是否乾淨','車身顏色','喇叭音量','座椅材質顏色'],answer:0,explanation:'電力越低碳，電動化替代化石燃料的整體減碳效益越完整。'},
{category:'綠色能源',question:'設置再生能源設施前應重視？',options:['環境影響與地方居民溝通','只追求速度','忽略文化景觀','不公開資訊'],answer:0,explanation:'能源轉型也要兼顧環境承載、公平與地方參與。'},
{category:'綠色能源',question:'儲能系統的生命週期管理包含？',options:['安全、材料來源與退役回收','只看購買價格','不需監測','使用後直接掩埋'],answer:0,explanation:'儲能設備從材料取得到退役處理，都需要安全與責任制度。'},
{category:'綠色能源',question:'家庭參與能源轉型的起點可以是？',options:['節電與選購高效率設備','增加待機設備','取消所有保養','只在尖峰用電'],answer:0,explanation:'節電、高效率設備與綠電方案，都是家庭可實踐的參與方式。'},
{category:'綠色能源',question:'淨零目標需要哪些力量共同作用？',options:['節能、再生能源、電網升級與自然碳匯','只靠一種能源','只靠個人少開燈','只靠植樹不減排'],answer:0,explanation:'淨零是多部門、多工具共同作用的長期轉型。'},
{category:'臺灣 2050 淨零',question:'淨零的基本意思是？',options:['排放量與移除量整體達到平衡','完全沒有任何排放','只計算家庭排放','只靠購買商品抵銷'],answer:0,explanation:'淨零指人為排放與移除在整體上達到平衡，仍須優先源頭減量。'},
{category:'臺灣 2050 淨零',question:'臺灣淨零路徑常談的四大轉型是？',options:['能源、產業、生活與社會','農業、娛樂、旅遊與運動','教育、醫療、體育與外交','金融、軍事、司法與交通'],answer:0,explanation:'四大轉型彼此相連，不能只依賴單一技術或單一部門。'},

{category:'臺灣 2050 淨零',question:'社會轉型的重要內容是？',options:['培養人才與提供公平轉型支持','只要求個人承擔','避免公民參與','讓成本集中於弱勢'],answer:0,explanation:'公平轉型要照顧人才、勞工與弱勢家庭，並納入公民參與。'},
{category:'臺灣 2050 淨零',question:'排放盤查與公開資料的作用是？',options:['檢驗措施是否有效','讓資訊更不透明','取代所有政策','只用來做廣告'],answer:0,explanation:'有可追蹤的資料，才能評估進度、修正措施與建立責任。'},

const REMOTE_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSHU6I3awRiqtk-_oeHsNK0xqVh31-SdtFQpl9g4qNVzDhPpHGKpA3Rp_gbzeACBw/pub?gid=1922463696&single=true&output=csv';
let bankSource='內建題庫';
let activeQuestions=[],submitted=false;
const $=s=>document.querySelector(s); const todayKey=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0} function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(list,random){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeSet(){const random=rng(hash(todayKey()));activeQuestions=shuffle(bank,random).slice(0,40).map((q,i)=>({...q,id:`q${i}`}));submitted=false;render();$('#result').classList.remove('show');$('#review').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function render(){const quiz=$('#quiz');quiz.innerHTML=activeQuestions.map((q,i)=>`<article class="question"><div class="qtop"><span class="qnum">${String(i+1).padStart(2,'0')}</span><span class="tag">${q.category}</span></div><h2>${q.question}</h2><div class="options">${q.options.map((o,j)=>`<div class="option"><input id="${q.id}-${j}" type="radio" name="${q.id}" value="${j}"><label for="${q.id}-${j}">${String.fromCharCode(65+j)}．${o}</label></div>`).join('')}</div></article>`).join('');$('#datePill').textContent=`${todayKey()}・40 題`;$('#statusText').textContent=`${bankSource}・共 ${bank.length} 題｜今日抽取 40 題`;bindProgress()}
function bindProgress(){document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',()=>{const answered=new Set([...document.querySelectorAll('input:checked')].map(i=>i.name)).size;$('#progressBar').style.width=`${answered/40*100}%`;$('#statusText').textContent=`已作答 ${answered} / 40 題`;}))}
function submit(e){e.preventDefault();if(submitted)return;const unanswered=activeQuestions.filter(q=>!document.querySelector(`input[name="${q.id}"]:checked`));if(unanswered.length){toast(`還有 ${unanswered.length} 題尚未作答`);document.querySelector(`input[name="${unanswered[0].id}"]`).focus();return}submitted=true;let score=0;const wrong=[];activeQuestions.forEach((q,index)=>{const chosen=Number(document.querySelector(`input[name="${q.id}"]:checked`).value);if(chosen===q.answer)score++;else wrong.push({...q,chosen,index})});$('#scoreText').textContent=`${score} / 40`;$('#resultTitle').textContent=score>=36?'太棒了！環境小達人':score>=28?'表現很好，再複習幾題':'完成挑戰，從錯題開始進步';$('#resultHint').textContent=`答對率 ${Math.round(score/40*100)}％${wrong.length?'，下方整理了需要複習的題目。':'，本次沒有錯題！'}`;$('#result').classList.add('show');$('#review').innerHTML=wrong.length?`<h2>錯題複習（${wrong.length} 題）</h2>${wrong.map(q=>`<article class="wrong"><div class="qtop"><span class="qnum">第 ${q.index+1} 題・${q.category}</span></div><div class="question-text">${q.question}</div><p>你的答案：${q.options[q.chosen]}</p><p class="answer">正確答案：${q.options[q.answer]}</p><p class="explain">詳解：${q.explanation}</p></article>`).join('')}`:'<h2>全部答對</h2><p class="empty">你已掌握今天的 40 題，明天再來挑戰新的題組！</p>';document.querySelectorAll('input').forEach(x=>x.disabled=true);window.scrollTo({top:0,behavior:'smooth'});localStorage.setItem(`quiz-${todayKey()}`,JSON.stringify({score,wrong:wrong.length}))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
$('#quizForm').addEventListener('submit',submit);$('#reshuffleBtn').addEventListener('click',()=>{if(submitted)makeSet();else{makeSet();toast('已依今天的日期重新整理題組')}});$('#importBtn').addEventListener('click',()=>$('#modal').classList.add('open'));$('#cancelImport').addEventListener('click',()=>$('#modal').classList.remove('open'));$('#confirmImport').addEventListener('click',()=>{const file=$('#fileInput').files[0];if(!file)return toast('請先選擇 CSV 或 JSON 檔');const reader=new FileReader();reader.onload=()=>{try{const parsed=file.name.toLowerCase().endsWith('.json')?JSON.parse(reader.result):parseCsv(reader.result);if(!Array.isArray(parsed)||parsed.length<40)throw new Error('題目需至少 40 題');bank.splice(0,bank.length,...parsed.map(normalize));$('#modal').classList.remove('open');makeSet();toast(`已匯入 ${bank.length} 題題庫`)}catch(err){toast('匯入失敗：請檢查欄位格式')}};reader.readAsText(file,'utf-8')});
function normalize(q){const pick=(...keys)=>{for(const key of keys){if(q[key]!==undefined&&String(q[key]).trim()!=='')return String(q[key]).trim()}return ''};const opts=q.options||[pick('optiona','選項a','選項Ａ','a','A'),pick('optionb','選項b','選項Ｂ','b','B'),pick('optionc','選項c','選項Ｃ','c','C'),pick('optiond','選項d','選項Ｄ','d','D')];let answer=pick('answer','答案','正確答案','correctanswer');if(typeof answer==='string'){const letter=answer.trim().toUpperCase();const n='ABCD'.indexOf(letter);answer=n>=0?n:Number(answer)}return{category:pick('category','分類','主題')||'未分類',question:pick('question','題目','問題'),options:opts,answer:Number(answer),explanation:pick('explanation','詳解','解析')||'請參考教材複習此題。'}}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;continue}if(ch==='"'){quoted=!quoted;continue}if(ch===','&&!quoted){row.push(cell.trim());cell='';continue}if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell='';continue}cell+=ch}if(cell||row.length){row.push(cell.trim());rows.push(row)}const head=rows.shift().map(v=>v.toLowerCase().replace(/^\ufeff/,''));return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||'']))).map(q=>({...q,options:q.options||[q.optiona,q.optionb,q.optionc,q.optiond]}))}
async function init(){
  $('#statusText').textContent='正在讀取 Google 雲端題庫…';
  try{const response=await fetch(REMOTE_CSV_URL,{cache:'no-store'});if(!response.ok)throw new Error('fetch failed');const rows=parseCsv(await response.text()).map(normalize).filter(q=>q.question&&q.options.filter(Boolean).length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length);if(rows.length<40)throw new Error('題目不足 40 題');bank.splice(0,bank.length,...rows);bankSource='Google 雲端題庫'}catch(error){bankSource='內建題庫（雲端讀取失敗）'}
  makeSet();
}
init();
</script>
